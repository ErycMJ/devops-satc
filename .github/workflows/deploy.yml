name: Deploy para GKE

on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitizar e validar variaveis GCP
        shell: bash
        run: |
          GCP_PROJECT_ID="$(printf '%s' "${GCP_PROJECT_ID}" | tr -d '\r\n' | xargs)"
          GCP_PROJECT_NUMBER="$(printf '%s' "${GCP_PROJECT_NUMBER}" | tr -d '\r\n' | xargs)"
          GKE_CLUSTER_NAME="$(printf '%s' "${GKE_CLUSTER_NAME}" | tr -d '\r\n' | xargs)"
          GKE_CLUSTER_LOCATION="$(printf '%s' "${GKE_CLUSTER_LOCATION}" | tr -d '\r\n' | xargs)"
          K8S_NAMESPACE="$(printf '%s' "${K8S_NAMESPACE}" | tr -d '\r\n' | xargs | tr '_' '-')"

          echo "GCP_PROJECT_ID=${GCP_PROJECT_ID}" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_NUMBER=${GCP_PROJECT_NUMBER}" >> "$GITHUB_ENV"
          echo "GKE_CLUSTER_NAME=${GKE_CLUSTER_NAME}" >> "$GITHUB_ENV"
          echo "GKE_CLUSTER_LOCATION=${GKE_CLUSTER_LOCATION}" >> "$GITHUB_ENV"
          echo "K8S_NAMESPACE=${K8S_NAMESPACE}" >> "$GITHUB_ENV"

          if [[ -z "${GCP_PROJECT_ID}" ]]; then
            echo "Variavel GCP_PROJECT_ID nao definida."
            exit 1
          fi
          if [[ ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "GCP_PROJECT_ID invalido: '${GCP_PROJECT_ID}'"
            echo "Use um project ID valido do GCP (nao nome/UUID)."
            exit 1
          fi
          if [[ -z "${GCP_PROJECT_NUMBER}" || ! "${GCP_PROJECT_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "GCP_PROJECT_NUMBER invalido: '${GCP_PROJECT_NUMBER}'"
            exit 1
          fi
          if [[ -z "${K8S_NAMESPACE}" || ! "${K8S_NAMESPACE}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "K8S_NAMESPACE invalido: '${K8S_NAMESPACE}'"
            echo "Use apenas minusculas, numeros e hifen."
            exit 1
          fi

      - name: Diagnostico de variaveis GCP
        shell: bash
        run: |
          if [[ -z "${GCP_PROJECT_NUMBER}" ]]; then
            echo "GCP_PROJECT_NUMBER: NAO DEFINIDA"
          else
            echo "GCP_PROJECT_NUMBER: definida (tamanho=${#GCP_PROJECT_NUMBER})"
            if [[ "${GCP_PROJECT_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "GCP_PROJECT_NUMBER formato: OK (numerico)"
            else
              echo "GCP_PROJECT_NUMBER formato: INVALIDO (deve conter apenas numeros)"
            fi
          fi

          echo "GCP_PROJECT_ID: definida (tamanho=${#GCP_PROJECT_ID})"
          if [[ "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "GCP_PROJECT_ID formato: OK"
          else
            echo "GCP_PROJECT_ID formato: INVALIDO"
          fi

          if [[ -z "${GKE_CLUSTER_NAME}" ]]; then
            echo "GKE_CLUSTER_NAME: NAO DEFINIDA"
          else
            echo "GKE_CLUSTER_NAME: definida"
          fi

          if [[ -z "${GKE_CLUSTER_LOCATION}" ]]; then
            echo "GKE_CLUSTER_LOCATION: NAO DEFINIDA"
          else
            echo "GKE_CLUSTER_LOCATION: definida (${GKE_CLUSTER_LOCATION})"
          fi
          echo "K8S_NAMESPACE efetivo: ${K8S_NAMESPACE}"

      - name: Autenticar no Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider2'
          service_account: 'gke-deploy-sa@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com'
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Obter credenciais GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}

      - name: Validar capacidade do cluster (nodes schedulables)
        shell: bash
        run: |
          TOTAL_NODES="$(kubectl get nodes --no-headers 2>/dev/null | wc -l | xargs)"
          READY_NODES="$(kubectl get nodes --no-headers 2>/dev/null | grep -c ' Ready ' || true)"

          echo "Nodes totais: ${TOTAL_NODES:-0}"
          echo "Nodes Ready: ${READY_NODES:-0}"

          if [[ "${TOTAL_NODES:-0}" -lt 1 || "${READY_NODES:-0}" -lt 1 ]]; then
            echo "Cluster sem nos prontos para agendamento."
            echo "Verifique node pool, cota/credito e autoscaler do GKE."
            kubectl get nodes -o wide || true
            exit 1
          fi

      - name: Replace vars nos manifests Kubernetes
        shell: bash
        run: |
          find k8s -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 | while IFS= read -r -d '' file; do
            sed -i "s|##DOCKER_USERNAME##|${{ secrets.DOCKER_USERNAME }}|g" "$file"
            sed -i "s|##K8S_NAMESPACE##|${K8S_NAMESPACE}|g" "$file"
            sed -i "s|##K8S_TAG##|${{ github.sha }}|g" "$file"
          done

      - name: Validar placeholders pendentes
        shell: bash
        run: |
          if grep -R -n "##[A-Z0-9_]\+##" k8s/; then
            echo "Ainda existem placeholders nao substituidos nos manifests."
            exit 1
          fi

      - name: Criar namespace se não existir
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar manifests Kubernetes
        shell: bash
        run: |
          kubectl apply -f k8s/deployment.yaml -n "${K8S_NAMESPACE}"
          kubectl apply -f k8s/hpa.yaml -n "${K8S_NAMESPACE}"

      - name: Aplicar Ingress (quando nginx estiver pronto)
        shell: bash
        run: |
          if kubectl -n ingress-nginx get svc ingress-nginx-controller-admission >/dev/null 2>&1; then
            ENDPOINTS="$(kubectl -n ingress-nginx get endpoints ingress-nginx-controller-admission -o jsonpath='{.subsets[*].addresses[*].ip}' || true)"
            if [[ -n "${ENDPOINTS}" ]]; then
              echo "Ingress NGINX admission pronto. Aplicando ingress."
              kubectl apply -f k8s/ingress.yaml -n "${K8S_NAMESPACE}"
            else
              echo "Ingress NGINX admission sem endpoints. Pulando apply do ingress por enquanto."
            fi
          else
            echo "Namespace/servico ingress-nginx nao encontrado. Pulando apply do ingress."
          fi

      - name: Aguardar rollout do deployment
        shell: bash
        run: |
          if kubectl rollout status deployment/app-satc -n "${K8S_NAMESPACE}" --timeout=300s; then
            exit 0
          fi

          echo "Rollout excedeu timeout. Verificando estado real do deployment..."
          UPDATED="$(kubectl get deployment app-satc -n "${K8S_NAMESPACE}" -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || echo 0)"
          AVAILABLE="$(kubectl get deployment app-satc -n "${K8S_NAMESPACE}" -o jsonpath='{.status.availableReplicas}' 2>/dev/null || echo 0)"
          READY="$(kubectl get deployment app-satc -n "${K8S_NAMESPACE}" -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)"

          echo "Replicas atualizadas: ${UPDATED:-0}"
          echo "Replicas disponiveis: ${AVAILABLE:-0}"
          echo "Replicas prontas: ${READY:-0}"

          if [[ "${UPDATED:-0}" -ge 1 && "${AVAILABLE:-0}" -ge 1 && "${READY:-0}" -ge 1 ]]; then
            echo "Deployment com replica nova disponivel; seguindo pipeline com aviso."
            exit 0
          fi

          echo "Deployment nao atingiu disponibilidade minima. Falhando pipeline."
          kubectl describe deployment app-satc -n "${K8S_NAMESPACE}" || true
          kubectl get pods -n "${K8S_NAMESPACE}" -l app=app-satc -o wide || true
          kubectl describe pods -n "${K8S_NAMESPACE}" -l app=app-satc || true
          kubectl get nodes -o wide || true
          exit 1

      - name: Diagnostico pos-deploy (Deployment/Service/HPA)
        if: always()
        shell: bash
        run: |
          kubectl get deployment app-satc -n "${K8S_NAMESPACE}" -o wide || true
          kubectl get pods -n "${K8S_NAMESPACE}" -l app=app-satc -o wide || true
          kubectl get svc app-satc -n "${K8S_NAMESPACE}" -o wide || true
          kubectl get hpa app-satc-hpa -n "${K8S_NAMESPACE}" -o wide || true
          kubectl describe deployment app-satc -n "${K8S_NAMESPACE}" || true
          kubectl describe pods -n "${K8S_NAMESPACE}" -l app=app-satc || true
          kubectl describe hpa app-satc-hpa -n "${K8S_NAMESPACE}" || true
          kubectl get nodes -o wide || true
          kubectl get events -n "${K8S_NAMESPACE}" --sort-by=.metadata.creationTimestamp | tail -n 50 || true
