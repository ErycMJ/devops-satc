name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/satc-devops:${{ github.sha }}
      TRIVY_MEDIUM_LIMIT: ${{ vars.TRIVY_MEDIUM_LIMIT || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=ErycMJ_devops-satc
            -Dsonar.organization=erycmj
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: docker push $IMAGE_NAME

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: trivy-results.json
          severity: MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results.json
          path: trivy-results.json

      - name: Analyze Trivy results
        shell: bash
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "Arquivo de resultados do Trivy nao encontrado."
            exit 1
          fi

          VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-results.json)
          echo "Quantidade de vulnerabilidades medias: $VULN_COUNT"
          echo "Limite configurado: $TRIVY_MEDIUM_LIMIT"

          if [ "$VULN_COUNT" -gt "$TRIVY_MEDIUM_LIMIT" ]; then
            echo "Pipeline bloqueada: mais de $TRIVY_MEDIUM_LIMIT vulnerabilidades medias encontradas."
            exit 1
          fi
